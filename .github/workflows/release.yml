name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  FILE_AND_LABEL: "{package-name}-{project-version}:{project-version}"

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check that the tag matches the TOC version
        if: github.ref_type == 'tag'
        run: |
          toc_version=$(sed -n 's/^## Version: *//p' ReScroll.toc | tr -d '\r')
          if [ "${GITHUB_REF_NAME#v}" != "$toc_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match '## Version: $toc_version' in ReScroll.toc"
            exit 1
          fi

      - name: Package and publish to GitHub and CurseForge
        if: github.ref_type == 'tag'
        uses: BigWigsMods/packager@v2
        with:
          args: -n "${{ env.FILE_AND_LABEL }}"
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

      - name: Package without publishing
        if: github.ref_type != 'tag'
        uses: BigWigsMods/packager@v2
        with:
          args: -d -n "${{ env.FILE_AND_LABEL }}"

      - name: Keep the test build
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: ReScroll-test
          path: .release/*.zip
